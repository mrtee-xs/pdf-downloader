    // Generate a unique session ID per browser tab
    const SESSION_ID = Math.random().toString(36).substring(2, 12);

    // --- Progress Tracking Hook (SSE + Fetch Streams) ---
    function usePdfProgress() {
      const [progressMap, setProgressMap] = useState({});

      useEffect(() => {
        const eventSource = new EventSource(`/api/progress-stream?sessionId=${SESSION_ID}`);
        eventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            setProgressMap(prev => ({
              ...prev,
              [data.url]: { ...prev[data.url], ...data }
            }));
          } catch (_) {}
        };
        return () => eventSource.close();
      }, []);

      const downloadLocalWithProgress = async (pdf) => {
        setProgressMap(prev => ({
          ...prev,
          [pdf.url]: { status: 'downloading-local', progress: 0 }
        }));

        try {
          const res = await fetch(`/api/download-local?url=${encodeURIComponent(pdf.url)}&filename=${encodeURIComponent(pdf.filename)}`);
          if (!res.ok || !res.body) throw new Error('Download stream failed');

          const totalBytes = parseInt(res.headers.get('Content-Length') || '0', 10) || pdf.sizeBytes || 0;
          const reader = res.body.getReader();
          const chunks = [];
          let receivedBytes = 0;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            if (value) {
              chunks.push(value);
              receivedBytes += value.length;
              if (totalBytes > 0) {
                const percent = Math.min(99, Math.round((receivedBytes / totalBytes) * 100));
                setProgressMap(prev => ({
                  ...prev,
                  [pdf.url]: {
                    status: 'downloading-local',
                    progress: percent,
                    transferredMB: (receivedBytes / (1024 * 1024)).toFixed(2),
                  }
                }));
              } else {
                setProgressMap(prev => ({
                  ...prev,
                  [pdf.url]: {
                    status: 'downloading-local',
                    progress: null,
                    transferredMB: (receivedBytes / (1024 * 1024)).toFixed(2),
                  }
                }));
              }
            }
          }

          const blob = new Blob(chunks, { type: 'application/pdf' });
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = pdf.filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);

          setProgressMap(prev => ({
            ...prev,
            [pdf.url]: { status: 'saved-local', progress: 100 }
          }));
        } catch (err) {
          setProgressMap(prev => ({
            ...prev,
            [pdf.url]: { status: 'failed', progress: 0, error: err.message }
          }));
        }
      };

      return { progressMap, downloadLocalWithProgress, sessionId: SESSION_ID };
    }

    // --- Main Application Component ---
    function App() {
      const { progressMap, downloadLocalWithProgress, sessionId } = usePdfProgress();

      // Search Mode: 'library' (Universal Book Search) vs 'site' (Website Scanner)
      const [searchMode, setSearchMode] = useState('library');

      // Inputs
      const [searchQuery, setSearchQuery] = useState('');
      const [siteUrl, setSiteUrl] = useState('');
      const [folderId, setFolderId] = useState('');
      const [customCookie, setCustomCookie] = useState('');
      const [showAdvanced, setShowAdvanced] = useState(false);

      // Results & Selection
      const [results, setResults] = useState([]);
      const [selectedUrls, setSelectedUrls] = useState(new Set());
      const [filterQuery, setFilterQuery] = useState('');

      // Loading states
      const [isSearching, setIsSearching] = useState(false);
      const [isZipping, setIsZipping] = useState(false);
      const [isBulkUploading, setIsBulkUploading] = useState(false);

      // Status & Alerts
      const [serverStatus, setServerStatus] = useState({
        loaded: false,
        driveConfigured: false,
        serviceAccountConfigured: false,
        oauthConfigured: false,
        authenticatedWithOAuth: false,
        authType: 'none',
        userEmail: null,
      });
      const [bannerMessage, setBannerMessage] = useState(null);
      const [cloudflareError, setCloudflareError] = useState(null);
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [showOAuthModal, setShowOAuthModal] = useState(false);
      const [oauthClientId, setOauthClientId] = useState('');
      const [oauthClientSecret, setOauthClientSecret] = useState('');
      const [isSavingOAuth, setIsSavingOAuth] = useState(false);
      const [copiedRedirectUri, setCopiedRedirectUri] = useState(false);

      const loadStatus = useCallback(() => {
        fetch('/api/status')
          .then(res => res.json())
          .then(data => setServerStatus({ loaded: true, ...data }))
          .catch(() => setServerStatus(prev => ({ ...prev, loaded: true })));
      }, []);

      // Restore folderId, initial status & check OAuth redirect params
      useEffect(() => {
        const savedFolder = localStorage.getItem('pdf_drive_folder_id');
        if (savedFolder) {
          setFolderId(savedFolder);
        } else {
          setFolderId('1WIgkg8aNOvxYpib3oXcuj1ITNS6A2gsg');
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('auth') === 'success') {
          setBannerMessage({
            type: 'success',
            text: '🎉 Google Account connected successfully! You can now stream books straight to your personal Google Drive (15 GB quota).'
          });
          window.history.replaceState({}, document.title, window.location.pathname);
        } else if (params.get('auth') === 'error') {
          setBannerMessage({
            type: 'error',
            text: `Google authorization failed: ${params.get('msg') || 'Unknown error'}`
          });
          window.history.replaceState({}, document.title, window.location.pathname);
        }

        loadStatus();
      }, [loadStatus]);

      const handleSaveAndConnectOAuth = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!oauthClientId.trim() || !oauthClientSecret.trim()) {
          setBannerMessage({ type: 'error', text: 'Please enter both Client ID and Client Secret.' });
          return;
        }

        setIsSavingOAuth(true);
        try {
          const res = await fetch('/api/auth/google/configure', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              clientId: oauthClientId.trim(),
              clientSecret: oauthClientSecret.trim(),
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to save OAuth credentials');

          // Immediately fetch the auth consent URL and redirect to Google
          const urlRes = await fetch('/api/auth/google/url');
          const urlData = await urlRes.json();
          if (!urlRes.ok || !urlData.url) throw new Error(urlData.error || 'Failed to generate sign-in URL');

          window.location.href = urlData.url;
        } catch (err) {
          setBannerMessage({ type: 'error', text: err.message });
          setIsSavingOAuth(false);
        }
      };

      const handleDirectSignIn = async () => {
        try {
          const urlRes = await fetch('/api/auth/google/url');
          const urlData = await urlRes.json();
          if (!urlRes.ok || !urlData.url) {
            setShowOAuthModal(true);
            return;
          }
          window.location.href = urlData.url;
        } catch (err) {
          setShowOAuthModal(true);
        }
      };

      const handleDisconnectGoogle = async () => {
        if (!confirm('Disconnect your personal Google account?')) return;
        try {
          await fetch('/api/auth/google/disconnect', { method: 'POST' });
          setBannerMessage({ type: 'info', text: 'Personal Google Drive disconnected.' });
          loadStatus();
        } catch (err) {
          setBannerMessage({ type: 'error', text: err.message });
        }
      };

      const copyRedirectUri = () => {
        const uri = 'http://localhost:4000/api/auth/google/callback';
        navigator.clipboard.writeText(uri).then(() => {
          setCopiedRedirectUri(true);
          setTimeout(() => setCopiedRedirectUri(false), 2000);
        });
      };

      const handleFolderChange = (val) => {
        setFolderId(val);
        localStorage.setItem('pdf_drive_folder_id', val.trim());
      };

      // Search Handler
      const handleSearch = async (e, overrideKeyword, overrideMode) => {
        if (e && e.preventDefault) e.preventDefault();

        const activeMode = overrideMode || searchMode;
        const kw = overrideKeyword !== undefined ? overrideKeyword : (activeMode === 'library' ? searchQuery : searchQuery);

        if (activeMode === 'site' && !siteUrl.trim()) {
          setBannerMessage({ type: 'error', text: 'Please enter a target site URL to scan.' });
          return;
        }

        setIsSearching(true);
        setBannerMessage(null);
        setCloudflareError(null);
        setSelectedUrls(new Set());

        try {
          const bodyPayload = {
            mode: activeMode,
            keyword: kw.trim(),
            folderId: folderId.trim() || undefined,
            cookie: customCookie.trim() || undefined,
          };

          if (activeMode === 'site') {
            bodyPayload.siteUrl = siteUrl.trim();
          }

          const res = await fetch('/api/search-pdfs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyPayload)
          });

          const data = await res.json();

          if (!res.ok) {
            if (data.isCloudflareProtected) {
              setCloudflareError({
                hostname: data.hostname || siteUrl,
                keyword: kw,
                message: data.error,
              });
              return;
            }
            throw new Error(data.error || 'Failed to scan website');
          }

          const initializedPdfs = (data.pdfs || []).map(pdf => ({
            ...pdf,
            status: pdf.existsInDrive ? 'success' : 'idle',
            driveLink: pdf.driveLink || null,
            alreadyExists: Boolean(pdf.existsInDrive),
            errorMsg: null,
          }));

          setResults(initializedPdfs);
          setSelectedUrls(new Set(initializedPdfs.map(p => p.url)));

          const alreadyInDriveCount = initializedPdfs.filter(p => p.existsInDrive).length;

          if (initializedPdfs.length === 0) {
            setBannerMessage({
              type: 'info',
              text: `No matching PDF books found for "${kw}". Try another keyword or author.`
            });
          } else {
            setBannerMessage({
              type: 'success',
              text: `Found ${initializedPdfs.length} PDF books!${alreadyInDriveCount > 0 ? ` (${alreadyInDriveCount} already archived in your Drive folder)` : ''} Ready to download or stream.`
            });
          }
        } catch (err) {
          setBannerMessage({ type: 'error', text: err.message });
        } finally {
          setIsSearching(false);
        }
      };

      // Quick fallback: Switch to Universal Library and search
      const switchToLibraryAndSearch = (kw) => {
        setSearchMode('library');
        setSearchQuery(kw);
        setCloudflareError(null);
        handleSearch(null, kw, 'library');
      };

      // Selection Handlers
      const toggleSelect = (url) => {
        const next = new Set(selectedUrls);
        if (next.has(url)) next.delete(url);
        else next.add(url);
        setSelectedUrls(next);
      };

      const selectAll = () => setSelectedUrls(new Set(filteredResults.map(p => p.url)));

        if (!filterQuery.trim()) return results;
        const q = filterQuery.toLowerCase();
        return results.filter(p =>
          (p.title || '').toLowerCase().includes(q) ||
          (p.filename || '').toLowerCase().includes(q) ||
          (p.author || '').toLowerCase().includes(q)

      const selectedCount = selectedUrls.size;
      const allSelected = filteredResults.length > 0 && selectedCount === filteredResults.length;
      const unsavedCount = useMemo(() => results.filter(p => !p.existsInDrive).length, [results]);

      const totalSelectedBytes = useMemo(() => {
        let total = 0;
        for (const item of results) {
          if (selectedUrls.has(item.url) && item.sizeBytes) {
            total += item.sizeBytes;
          }
        }
        return total;
      }, [results, selectedUrls]);

      const totalSelectedMB = (totalSelectedBytes / (1024 * 1024)).toFixed(2);

      // Bulk Action 1: Download Selected as .ZIP
      const handleBulkDownloadZip = async () => {
        const itemsToDownload = results.filter(p => selectedUrls.has(p.url));
        if (!itemsToDownload.length) return;

        setIsZipping(true);
        setBannerMessage({ type: 'info', text: `Packaging ${itemsToDownload.length} PDFs into books-bundle.zip...` });

        try {
          const res = await fetch('/api/download-zip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pdfs: itemsToDownload.map(p => ({ url: p.url, filename: p.filename })),
              cookie: customCookie || undefined,
            })
          });

          if (!res.ok) throw new Error('Failed to generate ZIP archive.');

          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'books-bundle.zip';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);

          setBannerMessage({ type: 'success', text: `Downloaded ${itemsToDownload.length} books in books-bundle.zip!` });
        } catch (err) {
          setBannerMessage({ type: 'error', text: err.message });
        } finally {
          setIsZipping(false);
        }
      };

      // Bulk Action 2: Save Selected to Google Drive
      const handleBulkUploadDrive = async () => {
        const itemsToUpload = results.filter(p => selectedUrls.has(p.url));
        if (!itemsToUpload.length) return;

        setIsBulkUploading(true);
        setBannerMessage({ type: 'info', text: `Streaming ${itemsToUpload.length} books to Google Drive with duplicate checks...` });

        try {
          const res = await fetch('/api/upload-drive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pdfs: itemsToUpload.map(p => ({
                url: p.url,
                filename: p.filename,
                sizeBytes: p.sizeBytes,
              })),
              folderId: folderId.trim() || undefined,
              sessionId,
              forceOverwrite: false,
              cookie: customCookie || undefined,
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Bulk Drive upload failed.');

          let uploadedCount = 0;
          let skippedCount = 0;

          setResults(prev => prev.map(p => {
            const match = (data.results || []).find(r => r.url === p.url);
            if (match) {
              if (match.status === 'success') uploadedCount++;
              if (match.status === 'skipped-duplicate') skippedCount++;
              return {
                ...p,
                status: match.status,
                driveLink: match.link || p.driveLink,
                alreadyExists: match.status === 'skipped-duplicate' || p.alreadyExists,
                errorMsg: match.error || null,
              };
            }
            return p;
          }));

          let summary = `Finished! Uploaded ${uploadedCount} books to Google Drive.`;
          if (skippedCount > 0) summary += ` (${skippedCount} already existed & were skipped).`;
          setBannerMessage({ type: 'success', text: summary });
        } catch (err) {
          setBannerMessage({ type: 'error', text: err.message });
        } finally {
          setIsBulkUploading(false);
        }
      };

            headers: { 'Content-Type': 'application/json' },

              pdfs: [{
                url: item.url,
                filename: item.filename,
                sizeBytes: item.sizeBytes,

              folderId: folderId.trim() || undefined,
              sessionId,
              forceOverwrite,
              cookie: customCookie || undefined,

          const data = await res.json();
          const uploadResult = data.results && data.results[0];

            status: uploadResult.status,
            driveLink: uploadResult.link,
            alreadyExists: uploadResult.status === 'skipped-duplicate' || p.alreadyExists,

                    </div>
                  </div>

                  {/* Right: Dual Bulk Download/Upload Actions */}
                  <div className="flex items-center gap-2.5 flex-wrap">
                    <button
                      onClick={handleBulkDownloadZip}
                      disabled={selectedCount === 0 || isZipping}
                      className="px-4 py-2 rounded-xl text-xs font-medium chrome-subtle-button flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
                      title="Stream all selected PDFs as a single ZIP archive to device"
                    >
                      {isZipping ? <IconLoader2 size={14} /> : <IconArchive size={14} className="text-zinc-200" />}
                      <span>Download Selected (.ZIP)</span>
                    </button>

                    <button
                      onClick={handleBulkUploadDrive}
                      disabled={selectedCount === 0 || isBulkUploading}
                      className="px-4 py-2 rounded-xl text-xs font-medium chrome-button flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
                      title="Directly stream selected PDFs to Google Drive"
                    >
                      {isBulkUploading ? <IconLoader2 size={14} /> : <IconCloudUpload size={14} />}
                      <span>Save Selected to Google Drive</span>
                    </button>
                  </div>
                </div>
              </div>

              {/* Results List */}
              <div className="space-y-3">
                {filteredResults.map((pdf, index) => {
                  const isChecked = selectedUrls.has(pdf.url);
                  const itemState = progressMap[pdf.url];
                  const prog = itemState || {};
                  const effectiveStatus = prog.status || pdf.status || 'idle';
                  const effectiveProgress = prog.progress !== undefined ? prog.progress : pdf.progress;
                  const effectiveTransferredMB = prog.transferredMB !== undefined ? prog.transferredMB : pdf.transferredMB;
                  const effectiveDriveLink = prog.link || pdf.driveLink;
                  const effectiveErrorMsg = prog.error || pdf.errorMsg;

                  return (
                    <div
                      key={pdf.url + index}
                      className={`group bg-white/5 backdrop-blur-md border rounded-xl p-4 transition-all hover:bg-white/[0.07] ${
                        isChecked ? 'border-white/20 bg-white/[0.06]' : 'border-white/5'
                      }`}
                    >
                      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        
                        {/* Book Metadata & Checkbox */}
                        <div className="flex items-start gap-3.5 flex-1 min-w-0">
                          <div className="pt-1.5">
                            <input
                              type="checkbox"
                              checked={isChecked}
                              onChange={() => toggleSelect(pdf.url)}
                              className="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-white focus:ring-0 focus:ring-offset-0 cursor-pointer accent-white"
                            />
                          </div>

                          {/* Optional Book Cover */}
                          {pdf.coverUrl ? (
                            <img
                              src={pdf.coverUrl}
                              alt=""
                              onError={(e) => { e.target.style.display = 'none'; }}
                              className="w-12 h-16 object-cover rounded-lg bg-zinc-800 border border-white/10 shrink-0 shadow-md hidden sm:block"
                            />
                          ) : (
                            <div className="w-10 h-12 rounded-lg bg-white/5 border border-white/10 shrink-0 hidden sm:flex items-center justify-center text-zinc-500">
                              <IconFileText size={18} />
                            </div>
                          )}

                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 flex-wrap">
                              <h3 className="text-sm font-semibold text-white tracking-tight truncate max-w-xl" title={pdf.title}>
                                {pdf.title}
                              </h3>

                              {(pdf.existsInDrive || itemState?.status === 'skipped-duplicate') && (
                                <a
                                  href={itemState?.link || pdf.driveLink}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="px-2.5 py-0.5 text-xs font-medium rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition flex items-center gap-1.5"
                                  title="Click to view file in Google Drive"
                                >
                                  <span>✓ Already in Drive</span>
                                  <IconExternalLink size={11} className="opacity-70" />
                                </a>
                              )}

                              {((!pdf.existsInDrive && itemState?.status !== 'skipped-duplicate') || effectiveStatus === 'downloading-local' || effectiveStatus === 'saved-local') && (
                                <StatusBadge
                                  status={effectiveStatus}
                                  driveLink={effectiveDriveLink}
                                  errorMsg={effectiveErrorMsg}
                                  progress={effectiveProgress}
                                  transferredMB={effectiveTransferredMB}
                                />
                              )}
                            </div>

                            {/* Author & Year (if available) */}
                            {pdf.author && (
                              <div className="text-xs text-zinc-400 mt-0.5">
                                by <span className="text-zinc-200">{pdf.author}</span> {pdf.year ? `(${pdf.year})` : ''}
                              </div>
                            )}

                            <div className="flex items-center gap-2 mt-1.5 text-xs text-zinc-400 font-mono flex-wrap">
                              <span className="flex items-center gap-1 text-zinc-300 bg-white/5 px-2 py-0.5 rounded border border-white/5 truncate max-w-xs">
                                <IconFileText size={12} className="text-zinc-400 shrink-0" />
                                <span className="truncate">{pdf.filename}</span>
                              </span>

                              {pdf.sizeFormatted && (
                                <span className="px-2.5 py-0.5 text-xs font-mono rounded-full bg-white/10 text-zinc-300 border border-white/10">
                                  {pdf.sizeFormatted}
                                </span>
                              )}

                              <a
                                href={pdf.url}
                                target="_blank"
                                rel="noreferrer"
                                className="truncate max-w-xs text-zinc-500 hover:text-zinc-300 underline underline-offset-2 transition text-[11px]"
                                title={pdf.url}
                              >
                                {pdf.url}
                              </a>
                            </div>
                          </div>
                        </div>

                        {/* Actions */}
                        <div className="flex items-center gap-2 shrink-0 self-end md:self-auto">
                          <button
                            onClick={() => downloadLocalWithProgress(pdf)}
                            disabled={effectiveStatus === 'downloading-local'}
                            className="px-3 py-1.5 rounded-lg text-xs font-medium chrome-subtle-button flex items-center gap-1.5 disabled:opacity-50 transition"
                            title="Download file directly with live byte & percentage tracking"
                          >
                            {effectiveStatus === 'downloading-local' ? (
                              <IconLoader2 size={13} className="animate-spin text-sky-400" />
                            ) : (
                              <IconDownload size={13} className="text-zinc-300" />
                            )}
                            <span>Download Local</span>
                          </button>

                          {pdf.existsInDrive || itemState?.status === 'skipped-duplicate' ? (
                            <button
                              onClick={() => handleSingleUploadDrive(pdf, true)}
                              disabled={effectiveStatus === 'uploading'}
                              className="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-800 hover:bg-zinc-700 border border-amber-500/30 text-amber-300 flex items-center gap-1.5 disabled:opacity-50 transition cursor-pointer"
                              title="Force re-upload this file and overwrite in Google Drive"
                            >
                              {effectiveStatus === 'uploading' ? (
                                <IconLoader2 size={13} className="animate-spin text-amber-400" />
                              ) : (
                                <IconCloudUpload size={13} className="text-amber-400" />
                              )}
                              <span>Re-upload (Overwrite)</span>
                            </button>
                          ) : (
                            <button
                              onClick={() => handleSingleUploadDrive(pdf, false)}
                              disabled={effectiveStatus === 'uploading'}
                              className="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-800 hover:bg-zinc-700 border border-white/10 text-white flex items-center gap-1.5 disabled:opacity-50 transition cursor-pointer"
                              title="Stream single file straight to Google Drive"
                            >
                              {effectiveStatus === 'uploading' ? (
                                <IconLoader2 size={13} className="animate-spin text-amber-400" />
                              ) : (
                                <IconCloudUpload size={13} className="text-zinc-300" />
                              )}
                              <span>Save to Drive</span>
                            </button>
                          )}
                        </div>
                      </div>

                      {/* Real-time Progress Bar */}
                      {itemState && (
                        <div className="w-full mt-3 pt-2.5 border-t border-white/5 animate-fadeIn">
                          <div className="flex justify-between items-center text-xs font-mono text-zinc-400 mb-1.5">
                            <span className="flex items-center gap-1.5">
                              <span>
                                {itemState.status === 'uploading' && 'Uploading to Google Drive...'}
                                {itemState.status === 'downloading-local' && 'Downloading to Device...'}
                                {itemState.status === 'success' && (itemState.alreadyExists ? 'Already in Google Drive (Skipped redundant upload)' : 'Saved to Google Drive')}
                                {itemState.status === 'skipped-duplicate' && 'Already in Google Drive (Duplicate skipped)'}
                                {itemState.status === 'saved-local' && 'Saved to Device'}
                                {itemState.status === 'failed' && `Error: ${itemState.error || 'Failed'}`}
                              </span>
                              {itemState.transferredMB && (
                                <span className="text-[11px] text-zinc-300 font-semibold">({itemState.transferredMB} MB transferred)</span>
                              )}
                            </span>
                            <span className="font-semibold text-white">{itemState.progress ?? 0}%</span>
                          </div>
                          <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-gradient-to-r from-zinc-400 to-white transition-all duration-200"
                              style={{ width: `${itemState.progress || 0}%` }}
                            />
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Empty State */}
          {results.length === 0 && !isSearching && !cloudflareError && (
            <div className="flex-1 flex flex-col items-center justify-center py-16 text-center border border-dashed border-white/10 rounded-2xl bg-white/[0.01]">
              <div className="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-4 text-zinc-400">
                <IconSearch size={24} />
              </div>
              <h3 className="text-base font-semibold text-white">Universal PDF Archivist</h3>
              <p className="text-xs md:text-sm text-zinc-500 max-w-md mt-1 mb-6">
                Type any book title, author, or keyword (e.g. <strong>Alex</strong>, <strong>Dune</strong>, <strong>Steve Jobs</strong>) above to instantly search 250,000+ full-text PDF books.
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-xl text-left text-xs">
                <div className="p-3 rounded-xl bg-white/5 border border-white/5">
                  <div className="font-semibold text-zinc-300 mb-1">1. 250k+ Open Books</div>
                  <div className="text-zinc-500">Instant PDF downloads with book covers, author metadata, and exact sizes.</div>
                </div>
                <div className="p-3 rounded-xl bg-white/5 border border-white/5">
                  <div className="font-semibold text-zinc-300 mb-1">2. Local ZIP Stream</div>
                  <div className="text-zinc-500">Stream all selected books bundled on the fly into a single .ZIP file.</div>
                </div>
                <div className="p-3 rounded-xl bg-white/5 border border-white/5">
                  <div className="font-semibold text-zinc-300 mb-1">3. Direct Drive Push</div>
                  <div className="text-zinc-500">Streams binary data straight from remote host to Drive with duplicate protection.</div>
                </div>
              </div>
            </div>
          )}

          {/* OAuth 2.0 Personal Drive Connection Modal */}
          {showOAuthModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="bg-[#121212] border border-white/15 rounded-2xl p-6 md:p-8 max-w-xl w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setShowOAuthModal(false)}
                  className="absolute top-4 right-4 text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-white/5"
                >
                  <IconX size={18} />
                </button>

                <div className="flex items-center gap-3 mb-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400">
                    <IconCloudUpload size={22} />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white">Connect Personal Google Drive</h3>
                    <p className="text-xs text-zinc-400">Unlock your free 15 GB quota on personal Google Drive</p>
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-blue-950/30 border border-blue-500/30 text-xs text-blue-200 mb-5 leading-relaxed">
                  <strong>Why is this required?</strong> Google assigns <strong>0 MB storage quota</strong> to automated Service Accounts on personal <code className="text-white">@gmail.com</code> drives. Connecting via OAuth 2.0 lets you upload books directly using your personal account's <strong>15 GB free storage</strong>!
                </div>

                <div className="space-y-4 text-xs">
                  <div className="p-4 rounded-xl bg-white/[0.03] border border-white/10 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h4 className="font-semibold text-white text-xs">Quick 2-Step Setup in Google Cloud Console</h4>
                      <a
                        href="https://console.cloud.google.com/apis/credentials?project=psychic-fold-498616-i0"
                        target="_blank"
                        rel="noreferrer"
                        className="text-blue-400 hover:text-blue-300 underline inline-flex items-center gap-1"
                      >
                        <span>Open Console (psychic-fold-498616-i0)</span>
                        <IconExternalLink size={12} />
                      </a>
                    </div>

                    <ol className="list-decimal list-inside space-y-2 text-zinc-300 pl-1">
                      <li>
                        In Google Cloud Console, click <strong>+ CREATE CREDENTIALS</strong> &rarr; <strong>OAuth client ID</strong>.
                        <div className="text-[11px] text-zinc-400 mt-0.5 ml-4">
                          (If prompted, click <em>Configure Consent Screen</em> &rarr; choose <em>External</em> &rarr; enter app name and email).
                        </div>
                      </li>
                      <li>
                        Set Application Type to <strong>Web application</strong>.
                      </li>
                      <li>
                        Under <strong>Authorized redirect URIs</strong>, click <strong>+ ADD URI</strong> and paste:
                        <div className="mt-1.5 flex items-center gap-2 bg-black/60 border border-white/10 p-2 rounded-lg font-mono text-[11px] text-emerald-300">
                          <span className="truncate flex-1">http://localhost:4000/api/auth/google/callback</span>
                          <button
                            type="button"
                            onClick={copyRedirectUri}
                            className="px-2 py-1 rounded bg-white/10 hover:bg-white/20 text-white flex items-center gap-1 transition text-[10px]"
                          >
                            <IconCopy size={11} />
                            <span>{copiedRedirectUri ? 'Copied!' : 'Copy'}</span>
                          </button>
                        </div>
                      </li>
                      <li>
                        Click <strong>CREATE</strong> and copy your <strong>Client ID</strong> and <strong>Client Secret</strong> below:
                      </li>
                    </ol>
                  </div>

                  <form onSubmit={handleSaveAndConnectOAuth} className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-medium text-zinc-300 mb-1">
                        OAuth Client ID:
                      </label>
                      <input
                        type="text"
                        value={oauthClientId}
                        onChange={(e) => setOauthClientId(e.target.value)}
                        placeholder="e.g. 123456789-abcdefghijk.apps.googleusercontent.com"
                        className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/15 text-white placeholder-zinc-600 text-xs focus:outline-none focus:border-blue-500 font-mono transition"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-zinc-300 mb-1">
                        OAuth Client Secret:
                      </label>
                      <input
                        type="password"
                        value={oauthClientSecret}
                        onChange={(e) => setOauthClientSecret(e.target.value)}
                        placeholder="e.g. GOCSPX-xxxxxxxxxxxxxxxxxxxx"
                        className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/15 text-white placeholder-zinc-600 text-xs focus:outline-none focus:border-blue-500 font-mono transition"
                        required
                      />
                    </div>

                    <div className="pt-3 border-t border-white/10 flex items-center justify-between gap-3">
                      <button
                        type="button"
                        onClick={() => setShowOAuthModal(false)}
                        className="px-4 py-2 rounded-xl text-xs font-medium text-zinc-400 hover:text-white"
                      >
                        Cancel
                      </button>

                      <button
                        type="submit"
                        disabled={isSavingOAuth || !oauthClientId.trim() || !oauthClientSecret.trim()}
                        className="px-5 py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg shadow-blue-500/25 border border-blue-400/40 flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed transition cursor-pointer"
                      >
                        {isSavingOAuth ? <IconLoader2 size={14} /> : <IconCloudUpload size={14} />}
                        <span>Save & Connect with Google</span>
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* Help Modal */}
          {showHelpModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-[#121212] border border-white/15 rounded-2xl p-6 md:p-8 max-w-lg w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setShowHelpModal(false)}
                  className="absolute top-4 right-4 text-zinc-400 hover:text-white"
                >
                  <IconX size={18} />
                </button>

                <h3 className="text-lg font-bold text-white mb-3 flex items-center gap-2">
                  <IconCloudUpload size={20} className="text-white" />
                  Google Drive Setup Options
                </h3>

                <div className="space-y-4 text-xs text-zinc-300">
                  {/* Option 1: Personal Drive */}
                  <div className="p-3.5 rounded-xl bg-blue-950/20 border border-blue-500/30">
                    <h4 className="font-semibold text-blue-300 mb-1">Option 1: Personal Google Drive (Recommended)</h4>
                    <p className="text-zinc-400 mb-2 leading-relaxed">
                      Uploads count against your personal 15 GB Google Drive quota.
                    </p>
                    <button
                      onClick={() => { setShowHelpModal(false); setShowOAuthModal(true); }}
                      className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs flex items-center gap-1.5 transition"
                    >
                      <IconCloudUpload size={13} />
                      <span>Configure Personal Sign-In</span>
                    </button>
                  </div>

                  {/* Option 2: Shared Drive with Service Account */}
                  <div className="p-3.5 rounded-xl bg-white/[0.03] border border-white/10">
                    <h4 className="font-semibold text-zinc-200 mb-1">Option 2: Google Workspace Shared Drive</h4>
                    <p className="text-zinc-400 mb-2 leading-relaxed">
                      If you have a Google Workspace account, service accounts can write unlimited files to <strong>Shared Drives</strong> (Team Drives).
                    </p>
                    <ol className="list-decimal list-inside space-y-1.5 text-zinc-400">
                      <li>Create or open a <strong>Shared Drive</strong> in Google Drive.</li>
                      <li>Add <code className="text-emerald-300 text-[11px]">pdf-bot@psychic-fold-498616-i0.iam.gserviceaccount.com</code> as <strong>Content Manager</strong>.</li>
                      <li>Paste the folder or Shared Drive ID into the <strong>Drive Folder ID</strong> box.</li>
                    </ol>
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-white/10 flex justify-end">
                  <button
                    onClick={() => setShowHelpModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-medium chrome-button"
                  >
                    Got It
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto pt-8 border-t border-white/5 text-center text-xs text-zinc-600">
            PDF Archivist &bull; Minimalist Dark Mode &bull; Express + React + Tailwind + Lucide
          </footer>
        </div>
      );
    }

    // Status Badge Helper
    function StatusBadge({ status, driveLink, errorMsg, progress, transferredMB }) {
      if (status === 'uploading') {
        const hasPercent = typeof progress === 'number' && progress > 0;
        return (
          <div className="inline-flex items-center gap-2">
            <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-mono font-medium bg-amber-950/60 text-amber-300 border border-amber-500/40">
              <IconLoader2 size={11} className="animate-spin text-amber-300 shrink-0" />
              <span>Uploading{hasPercent ? ` ${progress}%` : '...'}</span>
              {transferredMB && (
                <span className="opacity-75 text-[10px]">({transferredMB} MB)</span>
              )}
            </span>
            {hasPercent && (
              <div className="w-16 h-1.5 bg-zinc-800 rounded-full overflow-hidden border border-white/10 hidden sm:block">
                <div
                  className="h-full bg-gradient-to-r from-amber-400 to-amber-200 transition-all duration-200 rounded-full"
                  style={{ width: `${progress}%` }}
                />
              </div>
            )}
          </div>
        );
      }

      if (status === 'downloading-local') {
        const hasPercent = typeof progress === 'number' && progress > 0;
        return (
          <div className="inline-flex items-center gap-2">
            <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-mono font-medium bg-sky-950/60 text-sky-300 border border-sky-500/40">
              <IconLoader2 size={11} className="animate-spin text-sky-300 shrink-0" />
              <span>Downloading{hasPercent ? ` ${progress}%` : '...'}</span>
              {transferredMB && (
                <span className="opacity-75 text-[10px]">({transferredMB} MB)</span>
              )}
            </span>
          </div>
        );
      }

      if (status === 'saved-local') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-sky-950/60 text-sky-300 border border-sky-500/40">
            <IconCheck size={11} className="text-sky-400" />
            <span>Saved to Device</span>
          </span>
        );
      }

      if (status === 'success' || status === 'skipped-duplicate') {
        const isDuplicate = status === 'skipped-duplicate';
        return (
          <a
            href={driveLink || '#'}
            target="_blank"
            rel="noreferrer"
            className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-950/60 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-900/60 transition group/link"
            title={isDuplicate ? "Already in Google Drive (Duplicate Skipped)" : "Open in Google Drive"}
          >
            <IconCheck size={11} className="text-emerald-400" />
            <span>{isDuplicate ? "In Drive (Duplicate)" : "Saved to Drive"}</span>
            {driveLink && <IconExternalLink size={11} className="opacity-70 group-hover/link:opacity-100" />}
          </a>
        );
      }

      if (status === 'failed') {
        return (
          <span
            className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-950/60 text-rose-300 border border-rose-500/30"
            title={errorMsg || 'Upload failed'}
          >
            <IconAlertCircle size={11} className="text-rose-400" />
            <span>Failed {errorMsg ? `(${errorMsg.slice(0, 15)}...)` : ''}</span>
          </span>
        );
      }

      return (
        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-white/5 text-zinc-400 border border-white/10">
          <span>Ready</span>
        </span>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
